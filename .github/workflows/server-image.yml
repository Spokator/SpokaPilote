name: Image Docker de la console

# Publie l'image de la console centrale sur GitHub Container Registry à chaque version (tag vX.Y.Z) :
#   ghcr.io/spokator/spokapilote-server:<version>  et  :latest
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=dev" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/spokator/spokapilote-server:${{ steps.v.outputs.version }}
            ${{ startsWith(github.ref, 'refs/tags/v') && 'ghcr.io/spokator/spokapilote-server:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/Spokator/SpokaPilote
            org.opencontainers.image.description=SpokaPilote Server — console centrale du parc
            org.opencontainers.image.licenses=MIT
