name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SpokaPilote.sln

      - name: Build
        run: dotnet build SpokaPilote.sln -c Release --no-restore

      - name: Test
        env:
          SPOKAPILOTE_HOME: ${{ runner.temp }}\spokapilote
        run: dotnet test SpokaPilote.sln -c Release --no-build --logger "trx;LogFilePrefix=results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
