# Mises à jour automatiques des dépendances (une pull request par groupe, chaque lundi).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Dépendances NuGet"
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
      tests:
        patterns: ["xunit*", "coverlet*", "Microsoft.NET.Test.Sdk"]
    # Le projet reste sur .NET 10 LTS : pas de saut de version majeure des paquets de la plateforme.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Dépendances Actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Dépendances Docker"
    # Images .NET : rester sur la version LTS du projet (10.0) ; les correctifs arrivent via le tag 10.0.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]