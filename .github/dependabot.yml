# Mises à jour automatiques des dépendances (une pull request par groupe, chaque lundi).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Dépendances NuGet"
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
      tests:
        patterns: ["xunit*", "coverlet*", "Microsoft.NET.Test.Sdk"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Dépendances Actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Dépendances Docker"